apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-pipeline-production
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.sync-alerts: ""
    notifications.argoproj.io/subscribe.on-sync-failed.sync-alerts: ""
spec:
  project: gitops-pipeline
  source:
    repoURL: https://github.com/Thormie-Harshey/gitops-pipeline-config.git
    targetRevision: main
    path: overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
