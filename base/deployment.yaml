apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-pipeline-app
  labels:
    app: gitops-pipeline-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-pipeline-app
  template:
    metadata:
      labels:
        app: gitops-pipeline-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: app
          image: ghcr.io/thormie-harshey/gitops-pipeline-app
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
